name: Release

# Cross-platform Tauri build triggered by a git tag (e.g. `v0.1.0`) or manually
# from the Actions tab. Produces Win / Mac (universal) / Linux installers and
# publishes a GitHub Release with the binaries attached.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'K-M Paint Unmixer ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            - **Windows**: `.msi` (standard) or `.exe` (NSIS)
            - **macOS** (universal — Intel + Apple Silicon): `.dmg`
            - **Linux**: `.deb`, `.AppImage`, or `.rpm`

            Binaries are unsigned; Windows SmartScreen and macOS Gatekeeper
            may warn on first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
